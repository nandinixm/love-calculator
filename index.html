<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Love Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta property="og:title" content="Love Calculator💕">
<meta property="og:description" content="Find out your love score in 5 seconds 💖">
<meta property="og:image" content="https://love-calculatorx.vercel.app/cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://love-calculatorx.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Love Calculator💕">
<meta name="twitter:description" content="Find out your love score in 5 seconds 💖">
<meta name="twitter:image" content="https://love-calculatorx.vercel.app/cover.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; overflow-x: hidden; }

  :root {
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.4, 0.5, 1);
    --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(160deg, #ffe5f1 0%, #f5d5ff 45%, #e0d4ff 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px 26px;
    position: relative;
    overflow-x: hidden;
    color: #3d2b4f;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ================= SPLASH SCREEN ================= */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #ffe5f1 0%, #f5d5ff 45%, #e0d4ff 100%);
    transition: opacity 0.7s var(--ease-out), visibility 0.7s var(--ease-out);
  }
  #splash.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .splash-heart {
    width: 110px;
    height: 100px;
    margin-bottom: 18px;
    animation: splashPop 0.8s var(--ease-spring) forwards,
               splashBeat 1.2s var(--ease-soft) 0.8s infinite;
    transform: scale(0);
    filter: drop-shadow(0 10px 24px rgba(255, 77, 148, 0.4));
  }
  @keyframes splashPop {
    0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
    60%  { transform: scale(1.15) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes splashBeat {
    0%, 100% { transform: scale(1); }
    22%      { transform: scale(1.1); }
    45%      { transform: scale(1); }
    68%      { transform: scale(1.06); }
  }

  .splash-title {
    font-family: 'Pacifico', cursive;
    font-size: 34px;
    line-height: 1.1;
    background: linear-gradient(120deg, #ff4d94 0%, #d63384 45%, #b388eb 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.4px;
    opacity: 0;
    animation: splashTextIn 0.9s var(--ease-out) 0.4s forwards;
  }
  @keyframes splashTextIn {
    from { opacity: 0; transform: translate3d(0, 14px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  .splash-sub {
    font-family: 'Quicksand', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #a78bc7;
    margin-top: 8px;
    letter-spacing: 0.4px;
    opacity: 0;
    animation: splashTextIn 0.9s var(--ease-out) 0.7s forwards;
  }

  .splash-dots {
    display: flex;
    gap: 8px;
    margin-top: 22px;
    opacity: 0;
    animation: splashTextIn 0.6s var(--ease-out) 0.9s forwards;
  }
  .splash-dots span {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b9d, #d63384);
    animation: dotPulse 1.2s var(--ease-soft) infinite;
  }
  .splash-dots span:nth-child(1) { animation-delay: 0s; }
  .splash-dots span:nth-child(2) { animation-delay: 0.18s; }
  .splash-dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes dotPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50%      { transform: scale(1.35); opacity: 1; }
  }

  /* Hides scroll and gives the page a subtle entrance when splash fades */
  body.splashing { overflow: hidden; }
  /* ================================================= */

  #bgHearts {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bg-heart {
    position: absolute;
    bottom: -40px;
    font-size: 22px;
    opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translate3d(0, 0, 0) rotate(-12deg); opacity: 0; }
    14%  { opacity: 0.6; }
    86%  { opacity: 0.6; }
    100% { transform: translate3d(0, -115vh, 0) rotate(15deg); opacity: 0; }
  }

  .page {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hero { text-align: center; padding: 2px 0 4px; }
  .title {
    font-family: 'Pacifico', cursive;
    font-size: 38px;
    line-height: 1.1;
    background: linear-gradient(120deg, #ff4d94 0%, #d63384 45%, #b388eb 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.4px;
    display: inline-block;
    animation: titleFloat 4s var(--ease-soft) infinite;
    will-change: transform;
  }
  @keyframes titleFloat {
    0%, 100% { transform: translate3d(0, 0, 0); }
    50%      { transform: translate3d(0, -3px, 0); }
  }
  .subtitle {
    font-size: 13px;
    font-weight: 600;
    color: #a78bc7;
    margin-top: 6px;
    letter-spacing: 0.3px;
    opacity: 0;
    animation: fadeUp 0.9s var(--ease-out) 0.35s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translate3d(0, 8px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  .card {
    position: relative;
    width: 100%;
    background: linear-gradient(150deg, rgba(255, 253, 255, 0.94) 0%, rgba(255, 244, 251, 0.9) 55%, rgba(246, 240, 255, 0.9) 100%);
    border-radius: 34px;
    padding: 20px 20px 24px;
    box-shadow:
      0 22px 55px rgba(214, 51, 132, 0.18),
      0 6px 18px rgba(179, 136, 235, 0.14),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    animation: cardIn 1s var(--ease-out);
    overflow: hidden;
    contain: layout style paint;
    will-change: transform, opacity;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translate3d(0, 30px, 0) scale(0.95); }
    to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  .stage {
    position: relative;
    height: 168px;
    margin: 2px 0 10px;
    opacity: 0;
    animation: fadeUp 0.9s var(--ease-out) 0.15s forwards;
  }

  .char-shadow {
    position: absolute;
    bottom: -4px;
    width: 66px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(214, 51, 132, 0.22) 0%, rgba(214, 51, 132, 0) 70%);
    pointer-events: none;
  }
  .char-shadow.left  { left: 12px; }
  .char-shadow.right { right: 12px; }

  .character {
    position: absolute;
    bottom: 0;
    width: 88px;
    height: 158px;
    backface-visibility: hidden;
    transform: translateZ(0);
  }
  .character svg { width: 100%; height: 100%; display: block; }
  .char-left  { left: 2px; transform-origin: 100% 100%; }
  .char-right { right: 2px; transform-origin: 0% 100%; }

  .char-left, .char-right { will-change: transform; }
  .char-left svg  { animation: bobL 3.2s var(--ease-soft) infinite; transform-origin: 50% 100%; }
  .char-right svg { animation: bobR 3.2s var(--ease-soft) infinite; transform-origin: 50% 100%; }
  @keyframes bobL {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(-2deg); }
    50%      { transform: translate3d(0, -4px, 0) rotate(-2deg); }
  }
  @keyframes bobR {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(2deg); }
    50%      { transform: translate3d(0, -4px, 0) rotate(2deg); }
  }

  .stage.kissing .char-left  { animation: leanLeft 1.1s var(--ease-spring) forwards; }
  .stage.kissing .char-right { animation: leanRight 1.1s var(--ease-spring) forwards; }
  .stage.kissing .char-left svg,
  .stage.kissing .char-right svg { animation: none; }

  @keyframes leanLeft {
    0%   { transform: rotate(0deg); }
    60%  { transform: rotate(15deg); }
    82%  { transform: rotate(13deg); }
    100% { transform: rotate(14deg); }
  }
  @keyframes leanRight {
    0%   { transform: rotate(0deg); }
    60%  { transform: rotate(-15deg); }
    82%  { transform: rotate(-13deg); }
    100% { transform: rotate(-14deg); }
  }

  .kiss-heart-wrap {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate3d(-50%, -50%, 0) scale(0);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    will-change: transform, opacity;
  }
  .stage.kissing .kiss-heart-wrap {
    animation: kissWrapPop 0.9s var(--ease-spring) forwards;
  }
  @keyframes kissWrapPop {
    0%   { transform: translate3d(-50%, -50%, 0) scale(0);     opacity: 0; }
    55%  { transform: translate3d(-50%, -50%, 0) scale(1.3);   opacity: 1; }
    78%  { transform: translate3d(-50%, -50%, 0) scale(0.95);  opacity: 1; }
    100% { transform: translate3d(-50%, -50%, 0) scale(1);     opacity: 1; }
  }

  .kiss-heart {
    position: relative;
    width: 78px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .kiss-heart::before {
    content: '';
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 77, 148, 0.35) 0%, rgba(255, 77, 148, 0) 65%);
    pointer-events: none;
  }
  .kiss-heart svg {
    width: 72px;
    height: 66px;
    position: relative;
    animation: kissHeartBeat 1.6s var(--ease-soft) infinite;
    will-change: transform;
  }
  @keyframes kissHeartBeat {
    0%, 100% { transform: scale(1); }
    22%      { transform: scale(1.16); }
    45%      { transform: scale(1); }
    68%      { transform: scale(1.08); }
  }

  .burst-heart {
    position: absolute;
    top: 42%;
    left: 50%;
    pointer-events: none;
    z-index: 5;
    animation: burstOut 1.3s var(--ease-out) forwards;
    will-change: transform, opacity;
  }
  @keyframes burstOut {
    0%   { transform: translate3d(-50%, -50%, 0) scale(0.2); opacity: 1; }
    35%  { opacity: 1; }
    100% {
      transform: translate3d(calc(-50% + var(--tx)), calc(-50% + var(--ty)), 0) scale(1.35) rotate(60deg);
      opacity: 0;
    }
  }

  .panel {
    transition:
      max-height 0.7s var(--ease-out),
      opacity 0.5s var(--ease-out),
      transform 0.6s var(--ease-out);
    overflow: hidden;
  }
  .form-panel {
    max-height: 460px;
    opacity: 1;
    transform: translate3d(0, 0, 0);
  }
  .form-panel.hide {
    max-height: 0;
    opacity: 0;
    transform: translate3d(0, -8px, 0);
    pointer-events: none;
    margin-top: -9px;
  }
  .result-panel {
    max-height: 0;
    opacity: 0;
    transform: translate3d(0, 10px, 0);
    pointer-events: none;
  }
  .result-panel.show {
    max-height: 400px;
    opacity: 1;
    transform: translate3d(0, 0, 0);
    pointer-events: auto;
  }

  .form {
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding-bottom: 4px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    opacity: 0;
    animation: fadeUp 0.8s var(--ease-out) forwards;
  }
  #wrap1 { animation-delay: 0.28s; }
  #wrap2 { animation-delay: 0.38s; }

  .input-emoji {
    position: absolute;
    left: 15px;
    font-size: 17px;
    pointer-events: none;
  }
  .input-wrap input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    border-radius: 50px;
    border: 2px solid #ffd0e3;
    background: #fff;
    font-size: 16px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    color: #3d2b4f;
    outline: none;
    transition: border-color 0.25s var(--ease-soft), box-shadow 0.25s var(--ease-soft);
  }
  .input-wrap input::placeholder { color: #c9a9d6; font-weight: 500; }
  .input-wrap input:focus {
    border-color: #ff6b9d;
    box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.14);
  }
  .input-wrap.shake { animation: shake 0.5s var(--ease-soft); }
  @keyframes shake {
    0%, 100% { transform: translate3d(0, 0, 0); }
    20%      { transform: translate3d(-6px, 0, 0); }
    40%      { transform: translate3d(6px, 0, 0); }
    60%      { transform: translate3d(-4px, 0, 0); }
    80%      { transform: translate3d(4px, 0, 0); }
  }

  .cat-container {
    margin-top: 4px;
    padding: 11px 12px 12px;
    background: linear-gradient(135deg, rgba(255, 209, 227, 0.5), rgba(230, 210, 255, 0.4));
    border-radius: 22px;
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    opacity: 0;
    animation: fadeUp 0.8s var(--ease-out) 0.48s forwards;
  }
  .cat-label {
    font-size: 10.5px;
    font-weight: 700;
    color: #b185d0;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-left: 4px;
  }
  .categories {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }
  .chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 9px 4px 8px;
    border-radius: 14px;
    border: 1.5px solid rgba(255, 255, 255, 0.95);
    background: #fff;
    color: #a78bc7;
    font-family: 'Fredoka', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition:
      background 0.3s var(--ease-soft),
      color 0.3s var(--ease-soft),
      transform 0.35s var(--ease-spring),
      box-shadow 0.35s var(--ease-out);
    line-height: 1;
    -webkit-appearance: none;
  }
  .chip-emoji {
    font-size: 17px;
    line-height: 1;
    transition: transform 0.35s var(--ease-spring);
  }
  .chip-label { line-height: 1; }
  .chip:active { transform: scale(0.94); }
  .chip.active {
    background: linear-gradient(135deg, #ff6b9d, #d63384);
    color: white;
    border-color: transparent;
    box-shadow: 0 6px 14px rgba(214, 51, 132, 0.32);
    transform: translate3d(0, -1px, 0);
  }
  .chip.active .chip-emoji { transform: scale(1.2); }

  .calc-btn {
    margin-top: 6px;
    padding: 15px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff6b9d 0%, #d63384 60%, #b388eb 130%);
    color: white;
    font-family: 'Fredoka', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.4px;
    cursor: pointer;
    box-shadow: none;
    transition: transform 0.3s var(--ease-spring), filter 0.25s var(--ease-soft);
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.8s var(--ease-out) 0.58s forwards;
    will-change: transform;
  }
  .calc-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
    transform: translate3d(-100%, 0, 0);
    animation: shine 5s var(--ease-soft) 3s infinite;
    will-change: transform;
  }
  @keyframes shine {
    0%, 82%, 100% { transform: translate3d(-100%, 0, 0); }
    92%           { transform: translate3d(100%, 0, 0); }
  }
  .calc-btn:active { transform: scale(0.965); filter: brightness(0.95); }

  .result {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 4px;
  }

  .cat-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 50px;
    background: rgba(255, 209, 227, 0.7);
    color: #d63384;
    font-family: 'Fredoka', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 0.3px;
    opacity: 0;
    animation: fadeUp 0.6s var(--ease-out) 0.05s forwards;
  }

  .names-line {
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #6b4f7a;
    margin-bottom: 4px;
    text-align: center;
    line-height: 1.3;
    padding: 0 4px;
    opacity: 0;
    animation: fadeUp 0.6s var(--ease-out) 0.12s forwards;
  }
  .names-line .amp {
    color: #ff4d94;
    font-size: 19px;
    margin: 0 6px;
    display: inline-block;
    animation: heartBeat 1.6s var(--ease-soft) infinite;
    will-change: transform;
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    20%      { transform: scale(1.2); }
    40%      { transform: scale(1); }
  }

  .score-wrap {
    position: relative;
    margin: 2px 0 6px;
    opacity: 0;
    animation: fadeUp 0.6s var(--ease-out) 0.18s forwards;
  }
  .score {
    font-family: 'Fredoka', sans-serif;
    font-size: 70px;
    font-weight: 700;
    line-height: 1;
    background: linear-gradient(135deg, #ff4d94 0%, #d63384 50%, #b388eb 110%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -2px;
    display: inline-flex;
    align-items: baseline;
  }
  .score .pct { font-size: 38px; letter-spacing: 0; }
  .score.beat { animation: scorePop 0.7s var(--ease-spring); }
  @keyframes scorePop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .progress {
    width: 100%;
    height: 11px;
    border-radius: 50px;
    background: rgba(255, 209, 227, 0.55);
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: inset 0 2px 4px rgba(214, 51, 132, 0.1);
    opacity: 0;
    animation: fadeUp 0.6s var(--ease-out) 0.22s forwards;
  }
  .progress-fill {
    width: 0%;
    height: 100%;
    border-radius: 50px;
    background: linear-gradient(90deg, #ff9ec4 0%, #ff4d94 50%, #b388eb 100%);
    transition: width 1.3s var(--ease-out);
    position: relative;
    will-change: width;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    animation: shimmer 2.2s var(--ease-soft) infinite;
    will-change: transform;
  }
  @keyframes shimmer {
    0%   { transform: translate3d(-100%, 0, 0); }
    100% { transform: translate3d(100%, 0, 0); }
  }

  .message {
    font-family: 'Fredoka', sans-serif;
    font-size: 19px;
    font-weight: 600;
    color: #d63384;
    text-align: center;
    margin-bottom: 3px;
    line-height: 1.25;
    padding: 0 6px;
    opacity: 0;
    animation: fadeUp 0.6s var(--ease-out) 0.28s forwards;
  }
  .message-sub {
    font-size: 12.5px;
    font-weight: 600;
    color: #a78bc7;
    text-align: center;
    margin-bottom: 14px;
    opacity: 0;
    animation: fadeUp 0.6s var(--ease-out) 0.34s forwards;
  }

  .again-btn {
    width: 100%;
    padding: 12px;
    border-radius: 50px;
    background: #fff;
    color: #a78bc7;
    font-family: 'Fredoka', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-out);
    box-shadow: 0 4px 12px rgba(179, 136, 235, 0.16);
    border: 1.5px solid rgba(255, 209, 227, 0.9);
    opacity: 0;
    animation: fadeUp 0.6s var(--ease-out) 0.4s forwards;
    will-change: transform;
  }
  .again-btn:active { transform: scale(0.965); }

  .share-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 50px;

    const ease = t => 1 - Math.pow(1 - t, 5);
    function frame(now) {
      const t = Math.min((now - start) / duration, 1);
      scoreVal.textContent = Math.round(ease(t) * target);
      if (t < 1) {
        scoreRafId = requestAnimationFrame(frame);
      } else {
        scoreVal.textContent = target;
        scoreNum.classList.add('beat');
        setTimeout(() => scoreNum.classList.remove('beat'), 750);
        scoreRafId = null;
      }
    }
    scoreRafId = requestAnimationFrame(frame);
  }

  function scheduleShareReveal() {
    if (revealTimer) clearTimeout(revealTimer);
    revealTimer = setTimeout(() => {
      shareBtn.classList.add('revealed');
      shareHint.classList.add('revealed');
    }, 2200);
  }
  function hideShareReveal() {
    if (revealTimer) clearTimeout(revealTimer);
    shareBtn.classList.remove('revealed');
    shareHint.classList.remove('revealed');
  }

  /* ---------- Save to Supabase (fire-and-forget, non-blocking) ---------- */
  function saveCalculation(name1, name2, category, score) {
    db.from('calculations')
      .insert([{
        name1: name1,
        name2: name2,
        category: category,
        score: score
      }])
      .then(({ error }) => {
        if (error) console.warn('Supabase save failed:', error.message);
        else console.log('✅ Saved:', name1, '+', name2, '=', score);
      });
  }

  function calculate() {
    if (busy) return;
    const name1 = input1.value.trim();
    const name2 = input2.value.trim();

    if (!name1) { wrap1.classList.add('shake'); input1.focus(); setTimeout(() => wrap1.classList.remove('shake'), 550); return; }
    if (!name2) { wrap2.classList.add('shake'); input2.focus(); setTimeout(() => wrap2.classList.remove('shake'), 550); return; }

    busy = true;

    const base = loveScore(name1, name2, selectedCat.id);
    const score = Math.max(0, Math.min(100, base + selectedCat.mod));

    saveCalculation(name1, name2, selectedCat.id, score);

    formPanel.classList.add('hide');
    resultPanel.classList.add('show');
    stage.classList.add('kissing');

    setTimeout(burstHearts, 700);

    const msg = pickMessage(score);
    catBadge.textContent = `${selectedCat.emoji} ${selectedCat.label}`;
    namesLine.innerHTML = `${escapeHtml(name1)} <span class="amp">💗</span> ${escapeHtml(name2)}`;
    messageEl.textContent = msg.text;
    messageSub.textContent = msg.sub;

    setTimeout(() => {
      animateScore(score);
      progressFill.style.width = score + '%';
    }, 380);

    scheduleShareReveal();
    busy = false;
  }

  const SHARE_MESSAGES = [
    `Wait... how did it know?? 😳💖 find your love score 👉 ${'{URL}'}`,
    `You + your crush in 5 seconds. Do it 💕 I dare you 👉 ${'{URL}'}`,
    `I wasn't ready for my result 💀💘 try yours % 👉 ${'{URL}'}`,
    `Heyy check this out 💖 mind blowing 🤯 ${'{URL}'}`,
    `Try this before everyone else finds it 👀💘 love score 👉 ${'{URL}'}`,
    `Find your love score  👉 ${'{URL}'}`,
    `Try it 👉 ${'{URL}'}`,
    `Found the most accurate love calculator and I don't know how 💕 test it 👉 ${'{URL}'}`,
    `Do this right now % 😳💖 👉 ${'{URL}'}`,
    `Test this once 💀💕 ${'{URL}'}`,
    `Find your soulmate 💕 love calculator 👉 ${'{URL}'}`,
    `What's your love score? 💖 mine was shocking 😳 👉 ${'{URL}'}`
  ];

  let lastShareIndex = -1;

  function pickShareMessage(url) {
    let index;
    do {
      index = Math.floor(Math.random() * SHARE_MESSAGES.length);
    } while (index === lastShareIndex && SHARE_MESSAGES.length > 1);
    lastShareIndex = index;
    return SHARE_MESSAGES[index].replace(/\{URL\}/g, url);
  }

  function shareWhatsApp() {
    const url = window.location.href.split('#')[0].split('?')[0];
    const text = pickShareMessage(url);
    window.location.href = 'https://wa.me/?text=' + encodeURIComponent(text);
  }

  function reset() {
    if (scoreRafId) { cancelAnimationFrame(scoreRafId); scoreRafId = null; }
    resultPanel.classList.remove('show');
    formPanel.classList.remove('hide');
    stage.classList.remove('kissing');
    progressFill.style.width = '0%';
    scoreVal.textContent = '0';
    input1.value = '';
    input2.value = '';
    hideShareReveal();
    setTimeout(() => input1.focus(), 400);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  calcBtn.addEventListener('click', calculate);
  shareBtn.addEventListener('click', shareWhatsApp);
  againBtn.addEventListener('click', reset);
  input2.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
  input1.addEventListener('keydown', e => { if (e.key === 'Enter') input2.focus(); });
</script>
</body>
</html>
